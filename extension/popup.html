<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>当前作品采集</title><link rel="stylesheet" href="ui.css"></head>
<body class="popup"><header class="topbar"><div class="topinner">
  <strong class="brand"><i class="brandMark" aria-hidden="true"></i>评论工作台</strong><span id="version" class="version"></span>
</div></header>
<main>
  <section aria-label="当前采集"><h1 id="heading">采集当前作品</h1>
    <label for="limit">评论上限</label><div class="settings"><input id="limit" type="number" min="1" max="1000" step="1" value="50" required><span>条 / 作品</span><div class="presets"><button data-n="50">50</button><button data-n="100">100</button><button data-n="300">300</button></div></div>
    <div class="meter"><span id="phase">就绪</span><b id="count">0 / 50</b></div><progress id="bar" aria-label="采集进度" value="0" max="50"></progress>
    <div class="actions"><button class="primary" id="start">开始采集</button><button id="stop" disabled>停止</button></div>
    <output id="msg" role="status"></output>
  </section>
  <section class="platformSection" aria-labelledby="platformHeading"><h2 id="platformHeading">平台入口</h2><div id="platformLinks" class="platformLinks"></div>
    <p>先在平台打开作品详情，再从此处采集。采集结果保存在本机，可在样本整理中查看和导出。</p>
  </section>
</main>
<footer><button id="review">打开样本整理</button><button id="openTopic" class="quiet">按主题采集 <span aria-hidden="true">→</span></button></footer>
<script src="sites.js"></script><script src="popup.js"></script></body></html>
