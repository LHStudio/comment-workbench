<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>样本整理 · 评论工作台</title><link rel="icon" href="icons/workbench.svg"><link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="topic.css">
</head>
<body class="workspace">
  <header class="topbar"><div class="topinner">
    <strong class="brand"><img class="brandMark" src="icons/workbench.svg" alt="">评论工作台</strong>
    <nav aria-label="工作区导航"><a href="review.html" data-view="samples" aria-current="page">样本整理</a><a href="review.html?view=topic" data-view="topic">主题采集</a><a href="review.html?view=tools" data-view="tools">工具</a><a href="review.html?view=copyright" data-view="copyright">版权页</a></nav>
    <span class="local">本地工作区</span>
  </div></header>
  <main>
    <section id="samples" data-page="samples" aria-labelledby="sampleHeading">
      <div class="pageHeading"><div><p class="kicker">样本库</p><h1 id="sampleHeading">样本整理</h1></div>
        <div class="actions"><button id="refresh">刷新</button><button id="clear" class="danger">清空所有样本</button><button id="export" class="primary" title="无论筛选条件如何，均导出全部保留评论">导出全部 CSV</button></div>
      </div>
      <div id="stats" class="stats" aria-label="样本概览"></div>
      <div class="libraryHead"><h2>作品列表</h2><button id="manage" class="quiet">类型管理</button></div>
      <div class="filters">
        <label class="filterKeyword">关键词<input id="search" type="search" aria-label="搜索样本" placeholder="搜索作品、昵称或评论"></label>
        <label>来源平台<select id="platformFilter"><option value="">全部平台</option></select></label>
        <label>作品类型<select id="typeFilter"><option value="">全部类型</option></select></label>
        <button id="resetFilters" type="button" class="quiet">重置筛选</button>
      </div>
      <p id="resultCount" class="resultCount" role="status"></p>
      <div id="list"></div>
    </section>
    <section id="topicView" data-page="topic" hidden aria-labelledby="topicHeading">
      <div class="pageHeading"><div><p class="kicker">采集任务</p><h1 id="topicHeading">主题采集</h1></div></div>
      <div id="topicPanel"></div>
    </section>
    <section id="tools" data-page="tools" hidden aria-labelledby="toolsHeading">
      <div class="pageHeading"><div><p class="kicker">工作区设置</p><h1 id="toolsHeading">工具</h1></div></div>
      <section class="tool" aria-labelledby="pairHeading"><h2 id="pairHeading">连接分析工作台</h2><form id="pairForm" class="controls">
        <label>本机端口<input id="port" type="number" min="1024" max="65535" value="8765" required></label>
        <label>配对码<input id="pairKey" type="password" autocomplete="off" required></label>
        <label class="check"><input id="autoSend" type="checkbox" checked>采集后自动发送</label>
        <button>连接并保存</button><button id="push" type="button">发送全部保留样本</button><button id="disconnect" type="button">断开</button>
      </form><output id="bridgeStatus" role="status"></output></section>
    </section>
    <section data-page="copyright" hidden aria-labelledby="copyrightHeading">
      <div class="pageHeading"><div><p class="kicker">项目资料</p><h1 id="copyrightHeading">版权页</h1></div></div>
      <div class="creditBrand"><img width="64" height="64" src="icons/workbench.svg" alt=""><div><h2>评论工作台</h2><p lang="en">Design by LHStudio</p></div></div>
      <dl class="creditList"><div><dt>扩展版本</dt><dd id="creditVersion"></dd></div>
        <div><dt>GitHub 仓库</dt><dd><a href="https://github.com/LHStudio/comment-workbench" target="_blank" rel="noopener noreferrer">LHStudio/comment-workbench</a></dd></div></dl>
    </section>
    <output id="notice" role="status"></output>
  </main>
  <dialog id="settings"><form method="dialog" class="dialogHead"><h2>作品类型管理</h2><button aria-label="关闭">关闭</button></form>
    <div id="types"></div><form id="addtype"><input id="typename" aria-label="新类型名称" placeholder="新类型名称" maxlength="40" required><button>添加类型</button></form>
  </dialog>
  <script src="workspace.js"></script><script src="sites.js"></script><script src="review.js"></script><script src="pair.js"></script><script src="topic.js"></script>
</body></html>
